<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的梦境</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body {
        font-family: sans-serif;
        background: mistyrose;
        padding: 20px;
      }
      .card {
        background: white;
        padding: 15px;
        margin: 15px 0;
        border-radius: 15px;
      }
    </style>
  </head>
  <link rel="stylesheet" href="dream.css" />
  <body>
    <h1>🌙 我的梦境</h1>
    <div id="loginBox">
      <input id="email" placeholder="邮箱" />
      <input id="password" type="password" placeholder="密码" />
      <button onclick="login()">登录</button>
    </div>
    <div class="filter">
      <select id="monthSelect" onchange="loadDreams()">
        <option value="all">全部月份</option>
      </select>
    </div>
    <div class="dream-buttons">
      <button onclick="showAddBox()">+ 新增梦境</button>
      <button onclick="showImportBox()">📥 批量导入</button>
      <button onclick="fixOldTags()">🔧 修复旧标签</button>
      <button onclick="rebuildAllTags()">🔄 重新生成全部标签</button>
    </div>
    <div id="addBox" style="display: none">
      <input id="dreamDate" type="date" />
      <input id="dreamTitle" placeholder="梦境标题" />
      <textarea
        id="dreamContent"
        placeholder="记录你的梦..."
        rows="8"
      ></textarea>
      <button onclick="addDream()">保存</button>
    </div>
    </html>
<div id="importBox" style="display: none">
  <textarea
    id="importText"
    placeholder="把备忘录里的梦境全部粘贴到这里..."
    rows="15"
  ></textarea>
  <button onclick="importDreams()">开始导入</button>
</div>
<script src="dream.js"></script>
    <div id="dreamList"></div>
  </body>
